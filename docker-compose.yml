services:
  engine:
    build: ./engine
    restart: unless-stopped
    environment:
      ENGINE_PORT: 3001
      ENGINE_INTERNAL_SECRET: ${ENGINE_INTERNAL_SECRET}
      WWEBJS_DATA_PATH: /app/.wwebjs_auth
      PUPPETEER_HEADLESS: "true"
    volumes:
      - wwebjs_auth:/app/.wwebjs_auth
    # Never publish this port to the host — Laravel reaches it over the
    # private compose network at http://engine:3001. Only on `internal`,
    # unreachable from `ngrok` even if `ngrok` is compromised.
    networks: [internal]

  app:
    build: ./app
    restart: unless-stopped
    depends_on: [engine]
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: https://${DOMAIN}
      DB_CONNECTION: sqlite
      SESSION_SECURE_COOKIE: "true"
      WA_ENGINE_URL: http://engine:3001
      ENGINE_INTERNAL_SECRET: ${ENGINE_INTERNAL_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - app_database:/app/database
    # No `ports:` here — `app` is only reached over the private `web`
    # network, at http://app:8000, by the `ngrok` service.
    networks: [internal, web]

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    depends_on: [app]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    # --url requires a reserved/static domain from your ngrok account (free
    # tier includes one) so APP_URL and the public URL stay stable across
    # restarts — see README "Alternative : exposer avec ngrok".
    command: ["http", "--url=https://${DOMAIN}", "app:8000"]
    # No `ports:` here either — ngrok connects outbound to ngrok's cloud,
    # nothing needs to be published on the host or forwarded on the router.
    networks: [web]

networks:
  internal:
  web:

volumes:
  wwebjs_auth:
  app_database:
